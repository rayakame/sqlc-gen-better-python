baseURL: "https://sqlc-gen-better-python.rayakame.dev/"
title: sqlc-gen-better-python
enableRobotsTXT: true
enableGitInfo: true
hasCJKLanguage: false

# The docs use no tags/categories; without this Hugo publishes empty
# /tags/ and /categories/ pages that end up in the sitemap as thin content.
disableKinds:
  - taxonomy
  - term

# llms.txt at the site root plus a raw-Markdown render of every page
# (index.md next to each index.html) for AI tooling; both ship with hextra.
outputs:
  home:
    - html
    - llms
  page:
    - html
    - markdown
  section:
    - html
    - rss
    - markdown

module:
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

menu:
  main:
    - name: Docs
      pageRef: /docs
      weight: 1
    - name: Search
      weight: 2
      params:
        type: search
    - name: GitHub
      weight: 3
      url: "https://github.com/rayakame/sqlc-gen-better-python"
      params:
        icon: github

params:
  # params.title feeds og:site_name (the root-level title does not).
  title: sqlc-gen-better-python
  description: A sqlc plugin that generates modern, type-safe Python database code from SQL.
  # Social preview card (og:image / twitter:card); source: assets/og-image.svg.
  images:
    - images/og-image.png
  navbar:
    displayTitle: true
    displayLogo: false
  theme:
    default: system
    displayToggle: true
  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
  editURL:
    enable: true
    base: "https://github.com/rayakame/sqlc-gen-better-python/edit/main/docs/content"
  footer:
    displayCopyright: true
    displayPoweredBy: true
