version: "2"
plugins:
  - name: python
    wasm:
      url: file://sqlc-gen-better-python.wasm
      sha256: 854a673fa9c4eda3bdcb88482b375501fa06fb47913838382fd68c7b083a4a4a
sql:
  - schema: schema.sql
    queries:
      - queries.sql
    engine: mysql
    codegen:
      - out: /attrs/classes
        plugin: python
        options:
          package: test.driver_asyncmy.attrs.classes
          sql_driver: asyncmy
          model_type: attrs
          emit_classes: true
          omit_unused_models: false
          emit_init_file: true
          docstrings: numpy
          overrides:
            - column: test_type_override.text_test
              py_type:
                import: collections
                package: UserString
                type: UserString
            - column: test_enum_override.mood_test
              py_type:
                type: str
