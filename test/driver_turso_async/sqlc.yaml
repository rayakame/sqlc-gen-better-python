version: "2"
plugins:
  - name: python
    wasm:
      url: file://sqlc-gen-better-python.wasm
      sha256: 854a673fa9c4eda3bdcb88482b375501fa06fb47913838382fd68c7b083a4a4a
sql:
  - schema: schema.sql
    queries: queries.sql
    engine: sqlite
    codegen:
      - out: /attrs/classes
        plugin: python
        options:
          omit_kwargs_limit: 1
          package: test.driver_turso_async.attrs.classes
          sql_driver: turso_async
          model_type: attrs
          emit_classes: true
          omit_unused_models: true
          emit_init_file: true
          docstrings: numpy
          speedups: true
          overrides:
            - column: test_type_override.text_test
              py_type:
                import: collections
                package: UserString
                type: UserString
  - schema: schema.sql
    queries: queries.sql
    engine: sqlite
    codegen:
      - out: /attrs/functions
        plugin: python
        options:
          package: test.driver_turso_async.attrs.functions
          sql_driver: turso_async
          model_type: attrs
          emit_classes: false
          omit_unused_models: true
          emit_init_file: true
          docstrings: numpy
          overrides:
            - column: test_type_override.text_test
              py_type:
                import: collections
                package: UserString
                type: UserString
  - schema: schema.sql
    queries: queries.sql
    engine: sqlite
    codegen:
      - out: /dataclass/classes
        plugin: python
        options:
          package: test.driver_turso_async.dataclass.classes
          sql_driver: turso_async
          model_type: dataclass
          emit_classes: true
          omit_unused_models: true
          emit_init_file: true
          docstrings: google
          overrides:
            - column: test_type_override.text_test
              py_type:
                import: collections
                package: UserString
                type: UserString
  - schema: schema.sql
    queries:
      - queries.sql
      - queries_slice.sql
    engine: sqlite
    codegen:
      - out: /dataclass/functions
        plugin: python
        options:
          package: test.driver_turso_async.dataclass.functions
          sql_driver: turso_async
          model_type: dataclass
          emit_classes: false
          omit_unused_models: true
          emit_init_file: true
          docstrings: google
          overrides:
            - column: test_type_override.text_test
              py_type:
                import: collections
                package: UserString
                type: UserString
  - schema: schema.sql
    queries: queries.sql
    engine: sqlite
    codegen:
