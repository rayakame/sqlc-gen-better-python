version: "2"
plugins:
  - name: python
    wasm:
      url: file://sqlc-gen-better-python.wasm
      sha256: f9e26e327ba75ccd648dea1a55b9cbecbf6586686b5f7329dc15871b0b3fdc77
sql:
  - schema: schema.sql
    queries:
      - queries.sql
      - queries_override_adapter.sql
      - queries_override_converter.sql
      - queries_case.sql
      - queries_unknown_override.sql
    engine: sqlite
    codegen:
      - out: /attrs/classes
        plugin: python
        options:
          package: test.driver_turso_sync.attrs.classes
          sql_driver: turso_sync
          model_type: attrs
          emit_classes: true
          omit_unused_models: false
          emit_init_file: true
          docstrings: numpy
          speedups: true
          overrides:
            - column: test_type_override.text_test
              py_type:
                import: collections
                package: UserString
                type: UserString
            - column: test_override_conversion.price
              py_type:
                type: float
            - db_type: JULIANDAY
              py_type:
                type: str
