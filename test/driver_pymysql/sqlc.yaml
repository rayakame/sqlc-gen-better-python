version: "2"
plugins:
  - name: python
    wasm:
      url: file://sqlc-gen-better-python.wasm
      sha256: 280b38b7b6707173cdd88dda74399fca7045badfe2abdcc5420411d4f92e4965
sql:
  - schema: schema.sql
    queries:
      - queries.sql
      - queries_case.sql
      - queries_enum_override.sql
      - queries_field_namings.sql
      - queries_invalid_identifiers.sql
    engine: mysql
    codegen:
      - out: /attrs/classes
        plugin: python
        options:
          package: test.driver_pymysql.attrs.classes
          sql_driver: pymysql
          model_type: attrs
          emit_classes: true
          omit_unused_models: false
          emit_init_file: true
          docstrings: numpy
          overrides:
            - column: test_type_override.text_test
              py_type:
                import: collections
                package: UserString
                type: UserString
            - column: test_enum_override.mood_test
              py_type:
                type: str
  - schema: schema.sql
    queries:
