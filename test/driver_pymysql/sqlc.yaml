version: "2"
plugins:
  - name: python
    wasm:
      url: file://sqlc-gen-better-python.wasm
      sha256: 02ddf238b6c48ecfb79e5da90cbec179e420456c201e5977cca4ac34b697a993
sql:
  - schema: schema.sql
    queries:
      - queries.sql
      - queries_case.sql
      - queries_enum_override.sql
      - queries_field_namings.sql
      - queries_invalid_identifiers.sql
    engine: mysql
    codegen:
      - out: /attrs/classes
        plugin: python
        options:
          package: test.driver_pymysql.attrs.classes
          sql_driver: pymysql
          model_type: attrs
          emit_classes: true
          omit_unused_models: false
          emit_init_file: true
          docstrings: numpy
          overrides:
            - column: test_type_override.text_test
              py_type:
                import: collections
                package: UserString
                type: UserString
            - column: test_enum_override.mood_test
              py_type:
                type: str
  - schema: schema.sql
    queries:
      - queries.sql
      - queries_case.sql
      - queries_enum_override.sql
      - queries_field_namings.sql
      - queries_invalid_identifiers.sql
    engine: mysql
    codegen:
      - out: /attrs/functions
        plugin: python
        options:
          package: test.driver_pymysql.attrs.functions
          sql_driver: pymysql
          model_type: attrs
          emit_classes: false
          omit_unused_models: true
          emit_init_file: true
          docstrings: numpy
          overrides:
            - column: test_type_override.text_test
              py_type:
                import: collections
                package: UserString
                type: UserString
            - column: test_enum_override.mood_test
              py_type:
                type: str
  - schema: schema.sql
    queries:
      - queries.sql
      - queries_case.sql
      - queries_enum_override.sql
      - queries_field_namings.sql
      - queries_invalid_identifiers.sql
    engine: mysql
    codegen:
      - out: /dataclass/classes
        plugin: python
        options:
          package: test.driver_pymysql.dataclass.classes
          sql_driver: pymysql
          model_type: dataclass
          emit_classes: true
          omit_unused_models: true
          emit_init_file: true
          docstrings: google
          overrides:
            - column: test_type_override.text_test
              py_type:
                import: collections
                package: UserString
                type: UserString
            - column: test_enum_override.mood_test
              py_type:
                type: str
  - schema: schema.sql
    queries:
      - queries.sql
      - queries_case.sql
      - queries_enum_override.sql
      - queries_field_namings.sql
      - queries_invalid_identifiers.sql
      - queries_converters.sql
      - queries_slice.sql
    engine: mysql
    codegen:
      - out: /dataclass/functions
        plugin: python
        options:
          package: test.driver_pymysql.dataclass.functions
          sql_driver: pymysql
          model_type: dataclass
          emit_classes: false
          omit_unused_models: true
          emit_init_file: true
          docstrings: google
          overrides:
            - column: test_type_override.text_test
              py_type:
                import: collections
                package: UserString
                type: UserString
            - column: test_enum_override.mood_test
              py_type:
                type: str
            - column: test_converters.prefs
              converter: prefs
            - column: test_converters.maybe_prefs
              converter: prefs
            - column: test_converters.tags
              converter: tags
          converters:
            - name: prefs
              py_type:
                import: test.converters
                package: Preferences
                type: Preferences
              to_db: test.converters.encode_preferences
              from_db: test.converters.decode_preferences
            - name: tags
              py_type:
                type: frozenset[str]
              to_db: test.converters.encode_tags
              from_db: test.converters.decode_tags
