  - schema: schema.sql
    queries:
      - queries.sql
      - queries_case.sql
      - queries_enum_override.sql
      - queries_field_namings.sql
      - queries_invalid_identifiers.sql
    engine: mysql
    codegen:
      - out: /pydantic/functions
        plugin: python
        options:
          package: test.driver_pymysql.pydantic.functions
          sql_driver: pymysql
          model_type: pydantic
          emit_classes: false
          omit_unused_models: true
          emit_init_file: true
          docstrings: google
          overrides:
            - column: test_type_override.text_test
              py_type:
                import: collections
                package: UserString
                type: UserString
            - column: test_enum_override.mood_test
              py_type:
                type: str
  # db_type override coverage: DATETIME (uppercase on purpose) must match
  # the normalized type name case-insensitively, converting through the
  # stamp converter pair. Isolated module so the matrix datetimes stay
  # untouched.
  - schema: schema.sql
    queries: queries_dbtype_override.sql
    engine: mysql
    codegen:
      - out: /dbtype/functions
        plugin: python
        options:
          package: test.driver_pymysql.dbtype.functions
          sql_driver: pymysql
          model_type: dataclass
          emit_classes: false
          omit_unused_models: true
          emit_init_file: true
          docstrings: google
          overrides:
            - db_type: DATETIME
              converter: stamp
          converters:
            - name: stamp
              py_type:
                type: str
              to_db: test.converters.encode_stamp
              from_db: test.converters.decode_stamp
  # omit_typechecking_block coverage: the PEP 695 aliases and hoisted
  # annotation imports must be runtime-safe at module level, pinned on the
  # enum-override module.
  - schema: schema.sql
    queries: queries_enum_override.sql
    engine: mysql
    codegen:
      - out: /omit_tc/classes
        plugin: python
        options:
          package: test.driver_pymysql.omit_tc.classes
          sql_driver: pymysql
          model_type: dataclass
          emit_classes: true
          omit_unused_models: true
          emit_init_file: true
          omit_typechecking_block: true
          docstrings: google
          overrides:
            - column: test_enum_override.mood_test
              py_type:
                type: str
  - schema: schema.sql
    queries: queries_enum_override.sql
    engine: mysql
    codegen:
      - out: /omit_tc/functions
        plugin: python
        options:
          package: test.driver_pymysql.omit_tc.functions
          sql_driver: pymysql
          model_type: dataclass
          emit_classes: false
          omit_unused_models: true
          emit_init_file: true
          omit_typechecking_block: true
          docstrings: google
          overrides:
            - column: test_enum_override.mood_test
              py_type:
                type: str
