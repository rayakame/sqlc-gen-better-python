          sql_driver: pymysql
          model_type: pydantic
          emit_classes: true
          omit_unused_models: true
          emit_init_file: true
          docstrings: google
          overrides:
            - column: test_type_override.text_test
              py_type:
                import: collections
                package: UserString
                type: UserString
            - column: test_enum_override.mood_test
              py_type:
