kind: Fixed
body: 'Arguments of a reused `sqlc.slice` are no longer misordered when the query also contains a backtick- or bracket-quoted identifier holding a `?` (SQLite family), and a slice whose name contains `%` now expands correctly on the MySQL drivers - its marker was doubled in the SQL constant but not in the replacement the generated code performs, so the expansion silently matched nothing.'
